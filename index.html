<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1718">
<title>林间湖畔 · 小木屋 | Low Poly Lakeside Cabin</title>
<style>
  :root {
    --ink: #f4ead7;
    --muted: rgba(240, 232, 214, .62);
    --faint: rgba(240, 232, 214, .38);
    --glass: rgba(9, 19, 20, .55);
    --glass-line: rgba(246, 233, 208, .16);
    --gold: #f5c77e;
    --gold-bright: #ffdca2;
    --green: #9dc4a4;
    --shadow: 0 18px 60px rgba(0, 0, 0, .28);
    --ease: cubic-bezier(.22,.75,.22,1);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0a1314;
  }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
  }

  #app, #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #scene {
    display: block;
    outline: none;
    touch-action: none;
    cursor: grab;
    background:
      radial-gradient(circle at 50% 35%, #31504d 0%, #162525 48%, #080e0f 100%);
  }

  #scene:active { cursor: grabbing; }

  /* ── cinematic grade ───────────────────────────────────── */
  .grade {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(4, 12, 13, .38) 0%, rgba(4, 12, 13, 0) 26%),
      linear-gradient(0deg, rgba(3, 9, 10, .5) 0%, rgba(3, 9, 10, 0) 24%),
      radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 46%, rgba(2, 8, 9, .22) 80%, rgba(1, 5, 6, .48) 100%);
  }

  .grain {
    position: fixed;
    inset: -20%;
    z-index: 4;
    pointer-events: none;
    opacity: .045;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/></svg>");
    background-size: 180px 180px;
    mix-blend-mode: soft-light;
  }

  /* ── interface shell ───────────────────────────────────── */
  .ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    padding:
      max(26px, env(safe-area-inset-top))
      max(30px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(30px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .ui button, .ui a { pointer-events: auto; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
  }

  .brand {
    min-width: 0;
    text-shadow: 0 2px 24px rgba(0, 0, 0, .42);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: .34em;
    color: rgba(247, 233, 207, .66);
    text-transform: uppercase;
  }

  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
    opacity: .85;
  }

  .eyebrow em {
    font-style: normal;
    color: var(--gold);
    letter-spacing: .22em;
  }

  h1 {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    font-size: clamp(30px, 3.35vw, 49px);
    font-weight: 500;
    line-height: 1;
    letter-spacing: .09em;
    color: #f6eddb;
    white-space: nowrap;
  }

  h1 span {
    display: inline-block;
    color: var(--gold-bright);
    font-size: .68em;
    letter-spacing: .16em;
    margin-left: 5px;
    transform: translateY(-.08em);
  }

  .subtitle {
    margin: 13px 0 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 9.5px;
    letter-spacing: .27em;
    color: rgba(244, 236, 220, .44);
    text-transform: uppercase;
  }

  .subtitle b {
    color: rgba(244, 236, 220, .68);
    font-weight: 400;
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
  }

  .glass-btn {
    height: 39px;
    border: 1px solid var(--glass-line);
    border-radius: 999px;
    background: rgba(8, 18, 19, .38);
    color: rgba(246, 237, 220, .8);
    box-shadow: 0 9px 30px rgba(0, 0, 0, .12), inset 0 1px 0 rgba(255,255,255,.055);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    backdrop-filter: blur(16px) saturate(120%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 14px;
    font: inherit;
    font-size: 11px;
    letter-spacing: .12em;
    cursor: pointer;
    transition: border-color .35s var(--ease), background .35s var(--ease), color .35s var(--ease), transform .35s var(--ease);
  }

  .glass-btn:hover {
    border-color: rgba(245, 199, 126, .42);
    background: rgba(17, 29, 29, .56);
    color: #fff7e8;
    transform: translateY(-1px);
  }

  .glass-btn:active { transform: translateY(0) scale(.985); }

  .glass-btn svg {
    width: 15px;
    height: 15px;
    flex: 0 0 auto;
    opacity: .88;
  }

  .glass-btn.icon-only {
    width: 39px;
    padding: 0;
  }

  .glass-btn.primary {
    color: #20170d;
    background: linear-gradient(135deg, #f7d79f 0%, #eeb86e 100%);
    border-color: rgba(255, 232, 188, .66);
    box-shadow: 0 10px 32px rgba(219, 160, 77, .2), inset 0 1px 0 rgba(255,255,255,.55);
  }

  .glass-btn.primary:hover {
    color: #160f08;
    background: linear-gradient(135deg, #ffe4b5 0%, #f5c47d 100%);
  }

  /* ── bottom control dock ──────────────────────────────── */
  .bottombar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 22px;
  }

  .dock {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 10px 9px 18px;
    border: 1px solid rgba(246, 233, 208, .14);
    border-radius: 19px;
    background: linear-gradient(160deg, rgba(14, 25, 25, .72), rgba(8, 17, 18, .58));
    -webkit-backdrop-filter: blur(22px) saturate(130%);
    backdrop-filter: blur(22px) saturate(130%);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.055);
  }

  .dock-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-right: 3px;
  }

  .dock-meta small {
    font-size: 8px;
    letter-spacing: .24em;
    color: rgba(244, 235, 217, .34);
    text-transform: uppercase;
  }

  .dock-meta strong {
    font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "STSong", serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .16em;
    color: rgba(248, 239, 221, .85);
    white-space: nowrap;
  }

  .segmented {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid rgba(255,255,255,.055);
    border-radius: 13px;
    background: rgba(0, 0, 0, .18);
  }

  .mood-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: rgba(244, 235, 217, .46);
    border-radius: 10px;
    height: 39px;
    min-width: 76px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font: inherit;
    font-size: 11px;
    letter-spacing: .12em;
    cursor: pointer;
    position: relative;
    transition: color .35s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease);
  }

  .mood-btn svg {
    width: 15px;
    height: 15px;
    opacity: .72;
    transition: opacity .35s var(--ease), transform .5s var(--ease);
  }

  .mood-btn:hover { color: rgba(255, 248, 235, .9); }
  .mood-btn:hover svg { opacity: 1; }

  .mood-btn.active {
    color: #2a1d0e;
    background: linear-gradient(140deg, #f9dea9, #edbd74);
    box-shadow: 0 5px 18px rgba(219, 162, 78, .18), inset 0 1px 0 rgba(255,255,255,.54);
  }

  .mood-btn.active svg { opacity: 1; }

  .mood-btn.active svg.sun-icon { transform: rotate(18deg); }

  .side-note {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 9px;
    margin-bottom: 4px;
    text-align: right;
    text-shadow: 0 2px 18px rgba(0,0,0,.36);
  }

  .hint {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 10px;
    letter-spacing: .1em;
    color: rgba(242, 233, 215, .45);
    white-space: nowrap;
  }

  .hint svg { width: 13px; height: 13px; opacity: .55; }
  .hint i { width: 2px; height: 2px; border-radius: 50%; background: rgba(246,237,220,.2); }

  .quality {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 8.5px;
    letter-spacing: .2em;
    color: rgba(244, 235, 217, .34);
    text-transform: uppercase;
  }

  .quality .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #adcfaa;
    box-shadow: 0 0 10px rgba(173, 207, 170, .55);
    animation: pulse 3.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: .5; transform: scale(.85); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* ── toast ────────────────────────────────────────────── */
  .toast {
    position: fixed;
    z-index: 20;
    left: 50%;
    bottom: 106px;
    transform: translate(-50%, 14px);
    padding: 10px 17px;
    border-radius: 999px;
    border: 1px solid rgba(246, 233, 208, .15);
    background: rgba(8, 17, 18, .72);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    box-shadow: 0 14px 40px rgba(0,0,0,.3);
    font-size: 11px;
    letter-spacing: .08em;
    color: rgba(248, 239, 221, .8);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .35s var(--ease), transform .35s var(--ease), visibility .35s;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  /* ── loader ───────────────────────────────────────────── */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(56, 82, 70, .38), transparent 58%),
      #091213;
    transition: opacity 1.2s var(--ease), visibility 1.2s;
  }

  .loader.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-mark {
    width: 62px;
    height: 62px;
    margin-bottom: 26px;
    color: var(--gold);
    opacity: .92;
    filter: drop-shadow(0 0 18px rgba(245, 199, 126, .2));
    animation: floaty 4s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .loader-title {
    font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "STSong", serif;
    font-size: 22px;
    letter-spacing: .22em;
    color: rgba(247, 238, 220, .9);
    margin-bottom: 9px;
  }

  .loader-sub {
    font-size: 8.5px;
    letter-spacing: .31em;
    text-transform: uppercase;
    color: rgba(244, 235, 217, .3);
  }

  .loader-bar {
    margin-top: 28px;
    width: 166px;
    height: 1px;
    overflow: hidden;
    background: rgba(244, 235, 217, .12);
    position: relative;
  }

  .loader-bar::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 42%;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: loading 1.8s var(--ease) infinite;
  }

  @keyframes loading {
    from { transform: translateX(-120%); }
    to { transform: translateX(340%); }
  }

  /* ── webgl error ──────────────────────────────────────── */
  .error {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    background: #091213;
  }

  .error.show { display: flex; }
  .error h2 {
    font-family: "Noto Serif SC", "STSong", serif;
    font-weight: 400;
    letter-spacing: .15em;
    margin: 0 0 12px;
  }
  .error p {
    font-size: 12px;
    line-height: 1.9;
    color: var(--muted);
    max-width: 440px;
  }

  /* ── responsive ───────────────────────────────────────── */
  @media (max-width: 980px) {
    .ui { padding: 22px; }
    .actions .label { display: none; }
    .glass-btn { width: 39px; padding: 0; }
    .glass-btn.primary { width: auto; padding: 0 14px; }
    .dock-meta { display: none; }
  }

  @media (max-width: 720px) {
    .ui {
      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(18px, env(safe-area-inset-bottom))
        18px;
    }
    h1 { font-size: clamp(25px, 7.2vw, 34px); letter-spacing: .06em; }
    h1 span { font-size: .62em; letter-spacing: .1em; }
    .subtitle { font-size: 7.5px; letter-spacing: .18em; white-space: normal; line-height: 1.8; }
    .eyebrow { font-size: 8px; letter-spacing: .24em; margin-bottom: 10px; }
    .topbar { gap: 12px; }
    .actions { gap: 6px; }
    .glass-btn { height: 36px; }
    .glass-btn.icon-only, .actions .glass-btn:not(.primary) { width: 36px; padding: 0; }
    .glass-btn.primary { height: 36px; padding: 0 12px; font-size: 10px; }
    .bottombar { flex-direction: column; align-items: center; gap: 12px; }
    .dock {
      width: min(100%, 360px);
      padding: 7px;
      border-radius: 16px;
      justify-content: center;
    }
    .segmented { width: 100%; }
    .mood-btn {
      flex: 1;
      min-width: 0;
      height: 41px;
      padding: 0 9px;
      font-size: 10.5px;
      gap: 5px;
    }
    .mood-btn svg { width: 14px; height: 14px; }
    .side-note { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; margin: 0 2px; }
    .hint { font-size: 9px; letter-spacing: .04em; }
    .quality { display: none; }
    .toast { bottom: 140px; font-size: 10px; }
    .loader-title { font-size: 19px; letter-spacing: .16em; }
  }

  @media (max-height: 560px) and (orientation: landscape) {
    .brand .subtitle, .eyebrow, .side-note { display: none; }
    .ui { padding: 15px 20px; }
    h1 { font-size: 27px; }
    .dock { padding: 6px; }
    .mood-btn { height: 34px; }
    .bottombar { align-items: center; }
    .toast { bottom: 78px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

  <div id="app">
    <canvas id="scene" aria-label="林间湖畔低多边形小木屋 3D 场景"></canvas>

    <div class="ui">

        <div class="actions">

      <div class="bottombar">

        <div class="dock" aria-label="光线模式">

            <small>AMBIENCE</small>

              <span>白昼</span>
            </button>
            <button class="mood-btn" type="button" data-mood="dusk" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <path d="M3 17h18M6 17a6 6 0 0 1 12 0"/>
                <path d="M12 3v2.2M4.8 6.2l1.5 1.5M19.2 6.2l-1.5 1.5M2 21h20"/>
              </svg>
              <span>黄昏</span>
            </button>
            <button class="mood-btn" type="button" data-mood="night" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="loader" id="loader">
      <svg class="loader-mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 53h54M13 53V38l11-9 10 8v16M34 53V27l9-7 8 7v26" opacity=".55"/>
        <path d="M9 31l8-9 8 9M42 20l6-9 7 9"/>
        <path d="M23 53V42h5v11" opacity=".8"/>
        <circle cx="49" cy="9" r="2.4" opacity=".8"/>
        <path d="M2 57c5-2 8-1 12 0s7 1 12 0 8-1 12 0 8 1 12 0 8-1 12 0" opacity=".28"/>
      </svg>
      <div class="loader-title">林间湖畔 · 小木屋</div>
      <div class="loader-sub">Generating a quiet corner of the woods</div>
      <div class="loader-bar"></div>
    </div>

    <div class="error" id="error">
      <h2>这扇窗暂时没有打开</h2>
      <p>你的浏览器没有启用 WebGL 2。请使用最新版 Chrome / Edge，或在浏览器设置中开启硬件加速，然后重新打开页面。</p>
    </div>
  </div>
